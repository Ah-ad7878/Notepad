espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
activity = "1.12.4"
constraintlayout = "2.2.1"
googleGmsGoogleServices = "4.4.4"
firebaseStorage = "22.0.1"
firebaseDatabase = "22.0.1"
firebaseAuth = "23.2.0"
activityKtx = "1.13.0"
